<!doctype html><html><head><meta charset="utf-8"><title>MeshCore Command boards</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0c141b;color:#e6f4f2;font:13px Segoe UI,sans-serif}#bar{height:46px;display:flex;align-items:center;gap:6px;padding:5px 10px;background:#102630;border-bottom:1px solid #36515d;overflow-x:auto}button,input,select{font:inherit}button{border:1px solid #3b5965;border-radius:6px;padding:7px 11px;background:#193441;color:#e5f7f2;cursor:pointer;white-space:nowrap}button.active{background:#32d689;color:#06231c;border-color:#32d689}button:disabled{opacity:.5;cursor:default}#views{position:absolute;inset:46px 0 0}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;pointer-events:none}iframe.active{opacity:1;pointer-events:auto}dialog{width:min(480px,95vw);border:1px solid #51707d;border-radius:10px;color:#edf7f5;background:#142630}dialog::backdrop{background:#000a}label{display:block;margin:12px 0}input,select{display:block;width:100%;margin-top:4px;padding:8px;background:#0f1c24;color:#fff;border:1px solid #526e7a;border-radius:5px}#status{min-height:20px;color:#bcebd8}.row{display:flex;gap:7px;flex-wrap:wrap}.toolbar-spacer{flex:1}
</style></head><body><nav id="bar" aria-label="Connected boards"><div id="tabs" class="row"></div><button id="add" type="button" title="Add a board">+ Board</button><span class="toolbar-spacer"></span><button id="rename" type="button">Rename</button><button id="disconnect" type="button">Disconnect</button><button id="minimise" type="button" aria-label="Minimise">−</button><button id="fullscreen" type="button" aria-label="Toggle fullscreen">□</button><button id="exit" type="button" aria-label="Exit">×</button></nav><main id="views"></main><dialog id="connect"><h2>Connect another board</h2><p>Existing boards remain connected.</p><div class="row"><button id="wifi-mode" type="button">Wi-Fi</button><button id="ble-mode" type="button">Bluetooth</button></div><div id="wifi"><label>Radio IP address<input id="wifi-address" autocomplete="off" placeholder="192.168.1.100"></label><button id="wifi-connect" type="button">Connect Wi-Fi board</button></div><div id="ble" hidden><button id="ble-scan" type="button">Scan Bluetooth</button><label>MeshCore companion<select id="ble-devices"><option value="">Scan for a board</option></select></label><label>Board pairing PIN (if not already paired)<input id="ble-pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Six digits"></label><button id="ble-connect" type="button">Connect Bluetooth board</button></div><p id="status" role="status"></p><button id="close" type="button">Close</button></dialog><dialog id="rename-dialog"><h2>Rename board</h2><label>Board name<input id="rename-name" maxlength="64" autocomplete="off"></label><p id="rename-status" role="status"></p><div class="row"><button id="rename-save" type="button">Save name</button><button id="rename-cancel" type="button">Cancel</button></div></dialog><script>
(()=>{const $=id=>document.getElementById(id),views=new Map();let active='',busy=false;const api=()=>window.pywebview?.api;function status(text){$('status').textContent=text}function lock(value){busy=value;for(const id of ['wifi-connect','ble-connect','ble-scan'])$(id).disabled=value}function select(id){if(!views.has(id))return;active=id;for(const [key,item] of views){item.frame.classList.toggle('active',key===id);item.button.classList.toggle('active',key===id);item.button.setAttribute('aria-selected',String(key===id));item.frame.contentWindow?.postMessage({type:'mcc-board-active',id:key,active:key===id},location.origin)}}async function refresh(){const result=await api().board_list();if(result.error)throw Error(result.error);const live=new Set(result.boards.filter(b=>b.open).map(b=>b.id));for(const [id,v] of views)if(!live.has(id)){v.frame.remove();v.button.remove();views.delete(id)}for(const b of result.boards.filter(x=>x.open)){let v=views.get(b.id);if(!v){const frame=document.createElement('iframe'),button=document.createElement('button');frame.title=b.name;frame.addEventListener('load',()=>frame.contentWindow?.postMessage({type:'mcc-board-active',id:b.id,active:b.id===active},location.origin));frame.src='/board/'+b.id+'/';button.type='button';button.onclick=()=>select(b.id);$('views').append(frame);$('tabs').append(button);v={frame,button};views.set(b.id,v)}v.button.textContent=b.name;v.frame.title=b.name}if(!views.has(active)){active='';select(live.values().next().value)}else select(active);$('rename').disabled=!active;$('disconnect').disabled=!active}async function run(fn){if(busy)return;lock(true);try{await fn()}catch(e){status(e.message||'Connection failed.')}finally{lock(false)}}$('minimise').onclick=()=>api().minimize();$('fullscreen').onclick=()=>api().toggle_fullscreen();$('exit').onclick=()=>api().exit_app();$('add').onclick=()=>{$('connect').showModal();status('')};$('close').onclick=()=>$('connect').close();$('wifi-mode').onclick=()=>{$('wifi').hidden=false;$('ble').hidden=true};$('ble-mode').onclick=()=>{$('wifi').hidden=true;$('ble').hidden=false};$('wifi-connect').onclick=()=>run(async()=>{status('Connecting Wi-Fi board…');const r=await api().board_connect_wifi($('wifi-address').value);if(r.error)throw Error(r.error);await refresh();select(r.id);$('connect').close()});$('ble-scan').onclick=()=>run(async()=>{status('Scanning Bluetooth…');const r=await api().board_scan_ble();if(r.error)throw Error(r.error);$('ble-devices').replaceChildren(new Option(r.devices.length?'Choose a board':'No MeshCore BLE boards found',''));for(const d of r.devices)$('ble-devices').add(new Option(d.name,d.address));status('Scan complete.')});$('ble-connect').onclick=()=>run(async()=>{status('Connecting Bluetooth board…');const pin=$('ble-pin').value;$('ble-pin').value='';const r=await api().board_connect_ble($('ble-devices').value,pin);if(r.error)throw Error(r.error);await refresh();select(r.id);$('connect').close()});$('rename').onclick=()=>{const current=views.get(active);if(!current)return;$('rename-name').value=current.button.textContent;$('rename-status').textContent='';$('rename-dialog').showModal();$('rename-name').focus()};$('rename-cancel').onclick=()=>$('rename-dialog').close();$('rename-save').onclick=async()=>{if(busy)return;lock(true);try{const r=await api().board_rename(active,$('rename-name').value);if(r.error)throw Error(r.error);await refresh();$('rename-dialog').close()}catch(e){$('rename-status').textContent=e.message||'Could not rename board.'}finally{lock(false)}};$('disconnect').onclick=()=>run(async()=>{if(!active||!confirm('Disconnect this board?'))return;const r=await api().board_disconnect(active);if(r.error)throw Error(r.error);await refresh()});window.addEventListener('pywebviewready',()=>refresh().catch(e=>status(e.message)));})();
</script></body></html>
